apiVersion: apps/v1
kind: Deployment
metadata:
  name: vproapp
  labels:
    app: vproapp
spec:
  replicas: 1 # Maintains exactly 3 running copies of your application
  selector:
    matchLabels:
      app: vproapp # Must match the template labels below
  template:
    metadata:
      labels:
        app: vproapp # Label given to the Pods generated by this deployment
    spec:
      containers:
        - name: vproapp
          image: vprocontainers/vprofileapp # Container image to download and run
          imagePullPolicy: Always
          ports:
          - name: vproapp-port
            containerPort: 8080 # The port your container application listens on
      initContainers:
      - name: init-mydb
        image: busybox
        command: ['sh', '-c', "until nslookup vprodb.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local; do echo waiting for vprodb; sleep 2; done"]
      - name: init-memcache
        image: busybox
        command: ['sh', '-c', "until nslookup vprocache01.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local; do echo waiting for vprocache01; sleep 2; done"]
      - name: init-rabbitmq
        image: busybox
        command: ['sh', '-c', "until nslookup vpromq01.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local; do echo waiting for vpromq01; sleep 2; done"]